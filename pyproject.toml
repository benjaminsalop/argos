[project]
name = "argos"
version = "0.0.1"
description = "Proof-of-concept architecture for campaign-tunable political and public affairs analytics"
requires-python = ">=3.11"
dependencies = [
    "duckdb",
    "pyarrow",
    "polars",
    "pydantic>=2",
    "pyyaml",
    "typer",
    "httpx",
    "census",          # ACS access
    "statsmodels",     # lead/lag, regression
    "scikit-learn",
    "plotly",
    "anthropic",       # or any LLM provider behind argos.llm.client
]

[project.optional-dependencies]
ui = ["streamlit"]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
argos = "argos.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
